# Robots whose own body velocity is fused into their UWB filter (uwb_ekf_adapter.py).
# Read by linktrack.ekf.launch.py; robots not listed here use the UWB position only.
#
#   velocity_topic   geometry_msgs/TwistStamped, body frame (x forward, y left)
#   heading_topic    nav_msgs/Odometry with the robot's IMU heading (ENU from magnetic east)
#   heading_offset   [deg] the offset in
#                        v_uwb = Rot(heading_offset - yaw_imu) * diag(1, -1) * v_body
#                    leave it out when unknown: it is then estimated once from ~15 straight drives
#                    (0.5 m+ each) and logged, put the logged value here. It is not refined
#                    online (an online estimate followed the drift of the IMU heading).
#
# With a velocity the filter trusts the UWB less (std 0.3 m, gate 3): a blocked anchor drags the
# raw position for seconds, the odometry does not follow. dog_4 (2026-10-05, against mocap):
# RMS 0.142 -> 0.109 m, worst occlusion excursion 0.68 -> 0.41 m.
dog_4:
  velocity_topic: /dog_4/odom/twist           # go2_odom_twist.py (mohismrobotics_nav), from /sportmodestate
  heading_topic: /dog_4/odometry/filtered     # external IMU, robot_imu.launch.py
  heading_offset: 61.5                        # against mocap with the gyro bias removed (2026-10-05)

# RoboMasters: /rm_N/vel is the chassis velocity as the CAN bridge reports it (robomaster_can_ros_bridge
# sensing.cpp copies vbx/vby, cmd_vel goes out as send_speed(-x, -y, -wz)): it is the body velocity
# rotated by 180 deg (measured -174.6 / +176.2 deg, scale ~1, not mirrored; 2026-10-05).
# heading_offset = GUI's theta + delta (learned from cmd_vel drives, no mocap) + 180 deg;
# rm_2 cross-checked from straight drives: 238.5 deg (GUI 235.5 after its mag-gated relearning).
rm_0:
  velocity_topic: /rm_0/vel
  heading_topic: /rm_0/odometry/filtered
  heading_offset: 240.0
rm_1:
  velocity_topic: /rm_1/vel
  heading_topic: /rm_1/odometry/filtered
  heading_offset: 242.0
rm_2:
  velocity_topic: /rm_2/vel
  heading_topic: /rm_2/odometry/filtered
  heading_offset: 235.5
